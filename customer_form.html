<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати клієнта</title>
    <style>
        /* Основні стилі для фону та загального вигляду */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ffe6f2, #e6f7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Контейнер для контенту */
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: fadeIn 0.7s ease-in-out;
        }

        /* Анімація */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Стиль заголовка */
        h1 {
            font-size: 28px;
            color: #ff99cc;
            margin-bottom: 20px;
        }

        /* Стилі для міток та полів вводу */
        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            transition: box-shadow 0.3s, border-color 0.3s;
        }

        input[type="text"]:focus, input[type="email"]:focus, input[type="tel"]:focus {
            border-color: #99c2ff;
            outline: none;
            box-shadow: 0 0 8px rgba(153, 194, 255, 0.5);
        }

        /* Кнопка для збереження */
        button {
            padding: 10px;
            font-size: 16px;
            color: white;
            background-color: #99c2ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #80bfff;
        }

        /* Стиль посилань */
        .button-link {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            color: white;
            background-color: #ff99cc;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
            margin-top: 10px;
            transition: background-color 0.3s;
            font-weight: bold;
        }

        .button-link:hover {
            background-color: #ff80b3;
        }

        /* Вирівнювання посилань */
        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add customer</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
        </form>

        <div class="button-container">
            <a href="{% url 'PharmacyInterface:home' %}" class="button-link">Back Home</a>
            <a href="{% url 'PharmacyInterface:customer_list' %}" class="button-link">List of customers</a>
        </div>
    </div>
</body>
</html>
