<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <style>
        /* Основні стилі для фону та загального вигляду */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ffe6f2, #e6f7ff); /* Ніжний рожево-блакитний градієнт */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Контейнер для контенту */
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        /* Заголовок */
        h1 {
            font-size: 28px;
            color: #ff99cc; /* Ніжний рожевий */
            margin-bottom: 20px;
        }

        /* Стилі для списку продуктів */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            font-size: 16px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        /* Кнопка посилання на продукт */
        .button-link {
            display: inline-block;
            padding: 6px 12px;
            font-size: 14px;
            color: white;
            background-color: #eea0ff; /* Ніжний рожевий */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .button-link:hover {
            background-color: #ef66db;
        }

        /* Кнопка видалення */
        .delete-button {
            padding: 6px 12px;
            font-size: 14px;
            color: white;
            background-color: #99c2ff; /* Ніжний блакитний */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-left: 10px;
        }

        .delete-button:hover {
            background-color: #80bfff;
        }

        /* Стиль для посилання "Back to Home" та "Add New Product" */
        .back-link, .add-product-link {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            color: #ff99cc;
            background-color: #ffe6f2;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            margin-top: 20px;
            font-weight: bold;
        }

        .back-link:hover, .add-product-link:hover {
            background-color: #ffccdd;
            color: #333;
        }

        /* Анімація для кнопок */
        .delete-button, .button-link, .back-link, .add-product-link {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product List</h1>
        <ul>
            {% for product in products %}
                <li>
                    <a href="{% url 'PharmacyInterface:product_detail' product.product_id %}" class="button-link">{{ product.name }}</a>
                    <form action="{% url 'PharmacyInterface:delete_object' product.product_id %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="delete-button" onclick="return confirm('Are you sure you want to delete this product?');">Delete</button>
                    </form>
                </li>
            {% empty %}
                <li>No products available</li>
            {% endfor %}
        </ul>
        <a href="{% url 'PharmacyInterface:product_create' %}" class="add-product-link">Add New Product</a>
        <a href="{% url 'PharmacyInterface:home' %}" class="back-link">Back to Home</a>
    </div>
</body>
</html>
