<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        /* Основні стилі для фону та загального вигляду */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffccff, #ccf2ff); /* Ніжний рожево-блакитний градієнт */
            color: #333;
            overflow: hidden;
        }

        /* Контейнер для контенту */
        .container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }

        /* Заголовок */
        h1 {
            font-size: 28px;
            color: #ff80b3;
            margin-bottom: 15px;
            animation: slideIn 1s ease-out;
        }

        /* Текст */
        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 25px;
        }

        /* Стиль кнопок */
        .button-link {
            display: inline-block;
            padding: 12px 25px;
            font-size: 16px;
            color: white;
            background-color: #ff99cc;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
            transition: transform 0.3s, background-color 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .button-link:hover {
            background-color: #ff66b2;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        /* Анімація для контенту */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the page of our pharmacy!</h1>
        <p>You can do these operations:</p>
        <a href="{% url 'PharmacyInterface:product_list' %}" class="button-link">Go to product list</a>
        <a href="{% url 'PharmacyInterface:receipt_item' %}" class="button-link">Make Order</a>
        <a href="{% url 'PharmacyInterface:order_list' %}" class="button-link">See My Orders</a>
        <a href="{% url 'PharmacyInterface:customer_create' %}" class="button-link">Add customer</a>
    </div>
</body>
</html>
