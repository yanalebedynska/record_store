<!DOCTYPE html>
<html lang="en">
<head>
   {% load static %}
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Dashboard</title>


   <!-- Підключення Bokeh через CDN -->
   <script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.0.0.min.js"></script>
   <link rel="stylesheet" href="https://cdn.bokeh.org/bokeh/release/bokeh-3.0.0.min.css">


   <style>
       body {
           font-family: Arial, sans-serif;
           margin: 0;
           padding: 0;
           background-color: #f4f4f9;
       }
       .container {
           padding: 20px;
           max-width: 1200px;
           margin: 0 auto;
       }
       h1 {
           text-align: center;
           margin-bottom: 20px;
       }
       .chart-container {
           margin-bottom: 40px;
       }
       .chart-title {
           text-align: center;
           font-size: 18px;
           margin-bottom: 10px;
       }
       #plotly-bar, #bokeh-pie {
           width: 100%;
           height: 500px;
       }
   </style>
</head>
<body>
   <div class="container">
       <h1>Dashboard</h1>


       <!-- Кругова діаграма (Bokeh) -->
       <div class="chart-container">
           <div class="chart-title">Pie Chart (Bokeh): Order Distribution by Product</div>
           <div id="bokeh-pie"></div>
       </div>
   </div>


   <script>
       // Завантаження кругової діаграми (Bokeh)
       fetch("{% url 'PharmacyInterface:bokeh_pie_chart' %}?min_orders=1")
           .then(response => {
               if (!response.ok) {
                   throw new Error(`HTTP error! status: ${response.status}`);
               }
               return response.json();
           })
           .then(data => {
               Bokeh.embed.embed_item(data, "bokeh-pie-1"); // Вбудовуємо графік у контейнер з ID bokeh-pie
           })
           .catch(error => {
               console.error('Error loading pie chart (Bokeh):', error);
               document.getElementById('bokeh-pie-1').innerHTML = `<p style="color:red;">Error loading Bokeh pie chart: ${error.message}</p>`;
           });
   </script>
</body>
</html>
