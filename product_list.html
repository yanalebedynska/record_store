<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <style>
        /* Основні стилі для фону та загального вигляду */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ffe6f2, #e6f7ff); /* Ніжний рожево-блакитний градієнт */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Контейнер для контенту */
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        /* Заголовок */
        h1 {
            font-size: 28px;
            color: #ff99cc; /* Ніжний рожевий */
            margin-bottom: 20px;
        }

        /* Стилі для списку продуктів */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            font-size: 16px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Кнопки вирівняні по правому краю */
        .button-container {
            display: flex;
            gap: 10px; /* Відступи між кнопками */
            margin-left: auto; /* Вирівнювання по правому краю */
        }

        /* Кнопка посилання на продукт */
        .product-name {
            font-weight: bold;
            font-size: 16px;
            color: #333;
        }

        /* Кнопка деталей */
        .details-button {
            padding: 6px 12px;
            font-size: 14px;
            color: white;
            background-color: #c299ff; /* Зелений */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .details-button:hover {
            background-color: #bb73fd;
        }

        /* Кнопка редагування */
        .edit-button {
            padding: 6px 12px;
            font-size: 14px;
            color: white;
            background-color: #a3e3f4; /* Ніжний рожевий */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .edit-button:hover {
            background-color: #5dcef1;
        }

        /* Кнопка видалення */
        .delete-button {
            padding: 6px 12px;
            font-size: 14px;
            color: white;
            background-color: #ff99cc; /* Ніжний блакитний */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .delete-button:hover {
            background-color: #ef5faa;
        }

        /* Стиль для посилань "Back to Home" і "Add New Product" */
        .back-link, .add-product-link {
            display: inline-block;
            padding: 8px 16px;
            font-size: 14px;
            color: #ff99cc;
            background-color: #ffe6f2;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            margin-top: 20px;
            font-weight: bold;
        }
        .back-link:hover, .add-product-link:hover {
            background-color: #ffccdd;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product List</h1>
        <ul>
            {% for product in products %}
                <li>
                    <span class="product-name">{{ product.name }}</span>
                    <div class="button-container">
                        {% if product.product_id %}
                            <a href="{% url 'PharmacyInterface:product_detail' product.product_id %}" class="details-button">Details</a>
                            <a href="{% url 'PharmacyInterface:product_update' product.product_id %}" class="edit-button">Edit</a>
                            <form action="{% url 'PharmacyInterface:delete_object' product.product_id %}" method="post" style="display:inline;">
                                {% csrf_token %}
                                 <button type="submit" class="delete-button">Delete</button>
                            </form>
                        {% else %}
                            <span>No ID available</span>
                        {% endif %}
                    </div>
                </li>
            {% endfor %}
        </ul>

        <a href="{% url 'PharmacyInterface:product_create' %}" class="add-product-link">Add New Product</a>
        <a href="{% url 'PharmacyInterface:home' %}" class="back-link">Back to Home</a>
    </div>
</body>
</html>
